services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: splitsmart_postgres
    environment:
      POSTGRES_USER: splitsmart
      POSTGRES_PASSWORD: splitsmart
      POSTGRES_DB: splitsmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsmart -d splitsmart"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: splitsmart_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
    container_name: splitsmart_api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://splitsmart:splitsmart@postgres:5432/splitsmart
      SYNC_DATABASE_URL: postgresql+psycopg2://splitsmart:splitsmart@postgres:5432/splitsmart
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploy}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_SIZE_MB: 10
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_AI_PER_MINUTE: 10
      RATE_LIMIT_UPLOAD_PER_HOUR: 20
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    container_name: splitsmart_worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://splitsmart:splitsmart@postgres:5432/splitsmart
      SYNC_DATABASE_URL: postgresql+psycopg2://splitsmart:splitsmart@postgres:5432/splitsmart
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploy}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MAX_UPLOAD_SIZE_MB: 10
      UPLOAD_DIR: /app/uploads
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: splitsmart_web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  default:
    name: splitsmart_network
