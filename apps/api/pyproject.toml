[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitsmart-api"
version = "1.0.0"
description = "SplitSmart AI — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    # pgvector
    "pgvector>=0.3.5",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Task Queue
    "celery>=5.4.0",
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # File handling
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    # AI
    "google-generativeai>=0.8.0",
    # QR code
    "qrcode[pil]>=7.4.2",
    # Utilities
    "python-dotenv>=1.0.0",
    "shortuuid>=1.0.13",
    "structlog>=24.4.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
